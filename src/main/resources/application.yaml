server:
  port: 8080

spring:
  application:
    name: demo

  # Configuración de H2 y consola web
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  h2:
    console:
      enabled: true
      path: /h2-console

  # Configuración de JPA / Hibernate
  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

# Configuración personalizada de la aplicación
jwt:
  expiration:
    minutes: 15 # Opciones: 5, 10, 15, 30